# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Shared defaults: pissmyran/coderabbit/.coderabbit.yaml
# Keep only repository-specific settings here.
inheritance: true

reviews:
  path_instructions:
    # SSH trust and authentication.
    - path: "WindowsApp/Bastion.Core/{KnownHosts,SshSession,HostAuth,SftpBrowserSession}.cs"
      instructions: |
        When host key verification or authentication changes, check
        that TOFU still distinguishes the first connection from a changed
        key for the same host and port. A changed key must be rejected.
        Also check separate commands, SFTP and every ProxyJump hop
        where those connection paths exist.
        When agent forwarding changes, check that the user's
        explicit forwardAgent choice still controls access.

    # Concurrency and connection lifetime.
    - path: "WindowsApp/Bastion.Core/SshSession.cs"
      instructions: |
        When connect, keepalive or close changes, trace concurrent
        connect, channel-open and close sequences and auth failures.
        Check that promises and continuations complete at most
        once and that errors or close never leave calls pending.
        Check that late connections and channels are closed
        if the caller has already cancelled.
        An old keepalive monitor must not close a new session.
        Use the session tests as regression evidence.

    # Persistent format and merging.
    - path: "WindowsApp/Bastion.Core/{Host,HostAuth,HostStore,Snippet,SyncState,SyncEngine,ReferenceDate,FsUtil}.cs"
      instructions: |
        When serialization or storage changes, compare field names,
        UUID encoding, the 2001-01-01 date epoch and the tombstone format
        with existing readers and the wire-format fixtures.
        Check reading of older Host lists and, where snippets
        are included, state without the snippets field.
        Check that merge is idempotent and order independent,
        also with equal modifiedAt. A tombstone at least as new must
        win over the entry. Shared tombstones must not be dropped
        when hosts and snippets are stored in separate files.
        Check that changed write paths keep the complete previous
        data on failure and do not lose concurrent local changes.
        Do not assume identical feature support across platforms.
        Never change fixtures just to hide a format break.

    # Encrypted sync format.
    - path: "WindowsApp/Bastion.Core/SyncCrypto.cs"
      instructions: |
        When the envelope or the cryptography changes, check BSYNC1,
        the big-endian encoding of the iteration field, salt and the order
        nonce, ciphertext, tag against the other implementations.
        Check PBKDF2-HMAC-SHA256, AES-256-GCM, a fresh salt
        and a fresh nonce, and rejection of tampered envelopes.
        The input iteration count must be bounded before key derivation.
        Check compatibility with existing encrypted files
        and known test vectors. A wrong passphrase or corrupt data must
        never be read as an empty state that is then written back.

    # Command builders for remote systems.
    - path: "WindowsApp/Bastion.Core/{ArchiveOperations,DockerService}.cs"
      instructions: |
        When file names, keys or Docker references reach a command,
        check correct quoting for the actual shell and protection
        against both shell injection and flag injection.
        Separate container names from image references with a registry,
        tag or digest. Validation must not confuse the formats.
        On key deploy, existing authorized_keys must be kept.
        Check idempotence and verification with the new key.
        When process execution changes, check concurrent draining
        of stdout and stderr so full pipe buffers never block the process.

    # Publishing releases.
    - path: ".github/{workflows/release.yml,scripts/semantic_release.py,scripts/wait_for_checks.py,release-baseline,release-required-checks}"
      instructions: |
        When release decisions or the check gate change, check
        that the tag, the checks and the publication refer to the same target_sha.
        Missing, pending or failed required checks must never
        count as passed. Check pagination and the latest
        result per check and issuer on reruns.
        On concurrent releases or retries, check that an
        existing tag's target is verified and that the same release is not
        published again with different content.
        Check stable versions, rc and promote against the parser
        and existing release anchors without bypassing the check gate.

    - path: "WindowsApp/Bastion.Core/SshAgent.cs"
      instructions: |
        When agent message parsing changes, check frame lengths, identity
        counts, integer conversions and remaining bytes before allocation
        or slicing. Reject malformed or truncated responses.
        When signing changes, verify the SSH.NET boundary receives the
        SSH-encoded signature blob, not only raw signature bytes.
        Check resource cleanup on protocol errors and cancellation.
        Use SshAgentTests for regression evidence.

    - path: "WindowsApp/*.{cs,xaml}"
      instructions: |
        When WinUI behavior changes, check that UI updates occur on the
        UI thread and that network operations do not block that thread.
        Trace window and session closure through pending callbacks.
        Prevent callbacks from updating disposed or replaced UI state.
        When terminal or WebView2 integration changes, trace untrusted
        remote output across script, navigation and host-message boundaries.
        Remote output must not gain unintended host capabilities.

    - path: "WindowsApp/**/*.csproj"
      instructions: |
        When project configuration changes, preserve the separation between
        the Windows-only WinUI app and the cross-platform core and tests.
        Check that the app excludes nested core and test source files from
        its default compilation glob and references the core project.
        Check target-framework compatibility across project references.
        When terminal content paths change, verify copied assets and their
        runtime lookup paths agree.
        EnableWindowsTargeting permits restore; it does not establish that
        the WinUI app can build on Linux.

    - path: "WindowsApp/Bastion.Core.Tests/**"
      instructions: |
        When tests change, exercise the real core behavior and the changed
        failure paths. Keep tests runnable without WinUI.
        For SSH integration tests, inspect server and proxy cleanup,
        bounded waits and isolation between tests.
        The sync fixture is a copy of the format owned by bastion_apple.
        Require an upstream format basis for fixture changes; do not
        regenerate expected data merely to make an assertion pass.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "pissmyran/.github:GOVERNANCE.md"
      - "pissmyran/.github:BASTION.md"

  linked_repositories:
    - repository: pissmyran/bastion
      instructions: |
        Shared Bastion documentation and cross-platform coordination.
        Check relevant shared behavior and documentation changes.

    - repository: pissmyran/bastion_apple
      instructions: |
        Owns the shared sync format and upstream fixtures.
        Compare relevant model, serialization and encryption changes.
        Windows fixtures are copies, not the format authority.

    - repository: pissmyran/bastion_linux
      instructions: |
        Compare shared sync, encryption and SSH behavior when relevant.
        Do not require identical platform feature support.

    - repository: pissmyran/bastion_android
      instructions: |
        Compare shared sync and encryption compatibility when relevant.
        Do not require identical platform feature support.
