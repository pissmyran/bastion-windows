# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

inheritance: true

reviews:
  path_instructions:
    # SSH-tillit och autentisering.
    - path: "WindowsApp/Bastion.Core/{KnownHosts,SshSession,HostAuth}.cs"
      instructions: |
        När värdnyckelkontroll eller autentisering ändras, kontrollera
        att TOFU fortfarande skiljer första anslutningen från en ändrad
        nyckel för samma värd och port. En ändrad nyckel ska avvisas.
        Kontrollera även separata kommandon, SFTP och varje ProxyJump-led
        där dessa anslutningsvägar finns.
        På Android ska läs-, tolknings- och skrivfel i known_hosts
        avvisa anslutningen, inte aktivera AcceptAllServerKeyVerifier.
        Vid ändrad agentvidarebefordran, kontrollera att användarens
        uttryckliga forwardAgent-val fortfarande styr åtkomsten.

    # Samtidighet och anslutningars livstid.
    - path: "WindowsApp/Bastion.Core/SshSession.cs"
      instructions: |
        När anslutning, keepalive eller stängning ändras, följ samtidiga
        connect-, kanalöppnings- och close-förlopp samt autentiseringsfel.
        Kontrollera att promises och continuations fullbordas högst
        en gång och att fel eller stängning inte lämnar anrop väntande.
        Kontrollera att sent färdiga anslutningar och kanaler stängs
        om anroparen redan har avbrutit.
        En gammal keepalive-monitor får inte stänga en ny session.
        Använd TerminalTeardownRaceTests, AuthFailureTerminationTests
        och respektive plattforms sessionstester som regressionsunderlag.

    # Beständigt format och sammanslagning.
    - path: "WindowsApp/Bastion.Core/{Host,HostAuth,HostStore,Snippet,SyncState,SyncEngine,ReferenceDate,FsUtil}.cs"
      instructions: |
        När serialisering eller lagring ändras, jämför fältnamn,
        UUID-kodning, datumepoken 2001-01-01 och tombstones-formatet
        med befintliga läsare och wire-format-fixturer.
        Kontrollera läsning av äldre Host-listor och, där snippets
        ingår, tillstånd utan snippets-fältet.
        Kontrollera att merge är idempotent och ordningsoberoende,
        även vid lika modifiedAt. En minst lika ny tombstone ska
        vinna över posten. Gemensamma tombstones får inte tappas
        när hosts och snippets lagras i separata filer.
        Kontrollera att ändrade skrivvägar bevarar komplett tidigare
        data vid fel och inte förlorar samtidiga lokala ändringar.
        Anta inte identiskt funktionsstöd i Windows, Swift och Rust.
        Ändra inte fixturer enbart för att dölja ett formatbrott.

    # Krypterat synkformat.
    - path: "WindowsApp/Bastion.Core/SyncCrypto.cs"
      instructions: |
        När kuvertet eller kryptografin ändras, kontrollera BSYNC1,
        iterationsfältets big-endian-kodning, salt och ordningen
        nonce, ciphertext, tag mot de andra implementationerna.
        Kontrollera PBKDF2-HMAC-SHA256, AES-256-GCM, färskt salt
        och färsk nonce samt avvisning av manipulerade kuvert.
        Indatans iterationsantal ska begränsas före nyckelhärledning.
        Kontrollera kompatibilitet med befintliga krypterade filer
        och kända testvektorer. Fel lösenfras eller skadad data får
        inte tolkas som ett tomt tillstånd som sedan skrivs tillbaka.

    # Kommandobyggare för fjärrsystem.
    - path: "WindowsApp/Bastion.Core/{ArchiveOperations,DockerService}.cs"
      instructions: |
        När filnamn, nycklar eller Docker-referenser når ett kommando,
        kontrollera rätt citering för det faktiska skalet samt skydd
        mot både shell-injektion och flagginjektion.
        Skilj containernamn från image-referenser med registry,
        tagg eller digest. Valideringen får inte förväxla formaten.
        Vid nyckeldeploy ska befintliga authorized_keys bevaras.
        Kontrollera idempotens och verifiering med den nya nyckeln.
        När ProcessRunner ändras, kontrollera samtidig dränering
        av stdout och stderr så fulla pipebuffertar inte låser processen.

    # Publicering av versioner.
    - path: ".github/{workflows/release.yml,scripts/semantic_release.py,scripts/wait_for_checks.py,release-baseline,release-required-checks}"
      instructions: |
        När releasebeslut eller kontrollgrind ändras, kontrollera
        att tagg, kontroller och publicering avser samma target_sha.
        Saknade, väntande eller misslyckade obligatoriska kontroller
        får inte räknas som godkända. Kontrollera paginering och
        senaste resultat per kontroll och utfärdare vid omkörningar.
        Vid samtidiga releaser eller omförsök, kontrollera att en
        befintlig taggs mål verifieras och att samma release inte
        publiceras på nytt med annat innehåll.
        Kontrollera stabila versioner, rc och promote mot parsern
        och befintliga releaseankare utan att kringgå kontrollgrinden.
